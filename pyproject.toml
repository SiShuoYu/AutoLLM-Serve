[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citetune-cn"
version = "0.1.0"
description = "Reproducible evaluation and adaptation experiments for grounded Chinese LLM answers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CiteTune-CN contributors" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]
train = [
  "accelerate>=1.0,<2",
  "bitsandbytes>=0.44,<1",
  "datasets>=3.0,<5",
  "peft>=0.13,<1",
  "torch>=2.4,<3",
  "transformers>=4.45,<5",
  "trl>=0.20,<1",
]

[project.scripts]
citetune = "citetune.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/citetune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.coverage.run]
source = ["citetune"]
branch = true
omit = ["src/citetune/cli.py", "src/citetune/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["class QwenCandidateGenerator"]
